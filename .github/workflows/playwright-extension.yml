name: Chromium Extension Playwright Tests

on:
  push:
    branches: [main, feature, develop]
  pull_request:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    name: Run Playwright Tests (Headed Mode)
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧱 Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: 🔐 Create .env file from GitHub Secrets
        run: |
          echo "TEST_USERNAME=${{ secrets.TEST_USERNAME }}" >> .env
          echo "TEST_PASSWORD=${{ secrets.TEST_PASSWORD }}" >> .env
          echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> .env
          echo "TEST_EXTENSION=${{ secrets.TEST_EXTENSION }}" >> .env
          echo "RESTFUL_API=${{ secrets.RESTFUL_API }}" >> .env
          echo ".env file created"
        shell: bash

      # 🔹 Generate timestamp early so we can use it to name the report folder
      - name: 🕒 Generate timestamp
        id: timestamp
        run: echo "ts=$(date +'%Y-%m-%d_%H-%M-%S')" >> $GITHUB_OUTPUT

      - name: 🧩 Run Playwright tests (headed mode via Xvfb)
        id: run_tests
        run: |
          set -e
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            npx playwright test --headed --reporter=html
          mv playwright-report "playwright-report-${{ steps.timestamp.outputs.ts }}"
        env:
          CI: true

      - name: 📤 Upload Playwright test report artifact
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ steps.timestamp.outputs.ts }}
          path: playwright-report-${{ steps.timestamp.outputs.ts }}
          retention-days: 30

      - name: 📁 Prepare timestamped report for Pages
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p ./public/reports
          mv playwright-report-${{ steps.timestamp.outputs.ts }} ./public/reports/playwright-report-${{ steps.timestamp.outputs.ts }}

          echo "Report generated on ${{ steps.timestamp.outputs.ts }}" > ./public/reports/playwright-report-${{ steps.timestamp.outputs.ts }}/README.txt

          # Auto-generate HTML index (latest first)
          echo "<html><head><title>Playwright Test Reports</title><style>
          body { font-family: Arial, sans-serif; padding: 20px; background-color: #fafafa; color: #333; }
          h1 { color: #222; }
          a { text-decoration: none; color: #0366d6; }
          a:hover { text-decoration: underline; }
          .latest { background: #0366d6; color: #fff; padding: 10px 15px; border-radius: 8px; margin-bottom: 20px; display: inline-block; }
          ul { list-style-type: none; padding: 0; }
          li { margin: 6px 0; }
          </style></head><body>" > ./public/index.html

          echo "<h1>Playwright Test Reports</h1>" >> ./public/index.html

          latest=$(ls -dt ./public/reports/playwright-report-*/ | head -1)
          latest_ts=$(basename "$latest")
          echo "<a class='latest' href='reports/${latest_ts}/index.html'>View Latest Report (${latest_ts})</a>" >> ./public/index.html
          echo "<h2>All Reports</h2><ul>" >> ./public/index.html

          for d in $(ls -dt ./public/reports/playwright-report-*/); do
            ts=$(basename "$d")
            echo "<li><a href=\"reports/${ts}/index.html\">${ts}</a></li>" >> ./public/index.html
          done

          echo "</ul></body></html>" >> ./public/index.html

      - name: 🚀 Deploy Playwright report to GitHub Pages (keep history)
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          keep_files: true
          commit_message: "📊 Publish Playwright report - ${{ steps.timestamp.outputs.ts }}"

      # --- Clean up old reports (optional, keeps latest 10) ---
      - name: 🧹 Keep only latest 10 reports
        run: |
          git fetch origin gh-pages
          git checkout gh-pages
          ls -td reports/playwright-report-* | tail -n +11 | xargs rm -rf || true
          git add .
          git commit -m "🧹 Clean old reports" || true
          git push origin gh-pages
