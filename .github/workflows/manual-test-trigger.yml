name: Manual Test Run

on:
  workflow_dispatch:
    inputs:
      devices:
        type: choice
        required: true
        description: Select a device (or "all" to run all tests)
        default: Desktop (chromium)
        options:
          - Desktop (chromium)
          - Desktop (Microsoft Edge)
          - Mobile Chrome (iPhone 12)
          - Mobile Chrome (iPhone 13)
          - Mobile Chrome (iPhone 15)
          - Mobile Chrome (Pixel 5)
          - Mobile Chrome (Nexus 6P)
          - Mobile Chrome (Galaxy S5)
          - API Tests
          - all

permissions:
  contents: write

jobs:
  test:
    name: Run Playwright Tests (Headed Mode)
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧱 Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: 🔐 Create .env file from GitHub Secrets
        run: |
          echo "TEST_USERNAME=${{ secrets.TEST_USERNAME }}" >> .env
          echo "TEST_PASSWORD=${{ secrets.TEST_PASSWORD }}" >> .env
          echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> .env
          echo "TEST_EXTENSION=${{ secrets.TEST_EXTENSION }}" >> .env
          echo "RESTFUL_API=${{ secrets.RESTFUL_API }}" >> .env
          echo ".env file created"
        shell: bash

      - name: 🕒 Generate readable timestamp
        id: timestamp
        run: echo "ts=$(date '+%Y-%m-%d_%I-%M-%S_%p')" >> $GITHUB_OUTPUT

      # Run Playwright tests
      - name: 🧩 Run Playwright tests (headed mode via Xvfb)
        id: run_tests
        run: |
          set -e
          DEVICE="${{ github.event.inputs.devices }}"
          SAFE_DEVICE=$(echo "$DEVICE" | tr -d '()' | tr ' ' '-')

          echo "▶️ Running Playwright tests for: $DEVICE"

          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" bash <<EOF
            if [[ "$DEVICE" == "all" ]]; then
              echo "Running tests for all projects..."
              npx playwright test --headed --reporter=html
            else
              echo "Running tests for project: $DEVICE"
              npx playwright test --project="$DEVICE" --headed --reporter=html
            fi
            EOF

          REPORT_DIR="playwright-report-${{ steps.timestamp.outputs.ts }}-${SAFE_DEVICE}"
          echo "Renaming playwright-report → $REPORT_DIR"
          mv playwright-report "$REPORT_DIR"

          # Persist for later steps
          echo "REPORT_DIR=$REPORT_DIR" >> $GITHUB_ENV
        env:
          CI: true

      - name: 📤 Upload Playwright test report artifact
        uses: actions/upload-artifact@v4
        env:
          REPORT_DIR: ${{ env.REPORT_DIR }}
        with:
          name: ${{ env.REPORT_DIR }}
          path: ${{ env.REPORT_DIR }}
          retention-days: 30

      - name: 📁 Prepare timestamped report for Pages
        if: github.ref == 'refs/heads/main'
        env:
          REPORT_DIR: ${{ env.REPORT_DIR }}
        run: |
          mkdir -p ./public/reports
          mv "$REPORT_DIR" ./public/reports/

          echo "Report generated on ${{ steps.timestamp.outputs.ts }}" > ./public/reports/$REPORT_DIR/README.txt

          # 🖤 Auto-generate dark themed HTML index with redirect & timestamp badge
          echo "<html><head><title>Playwright Test Reports</title>
          <meta http-equiv='refresh' content='5;url=reports/$REPORT_DIR/index.html'>
          <style>
          body { font-family: 'Segoe UI', Arial, sans-serif; padding: 30px; background-color: #0d1117; color: #c9d1d9; }
          h1, h2 { color: #58a6ff; }
          a { text-decoration: none; color: #58a6ff; }
          a:hover { text-decoration: underline; }
          .latest { background: #238636; color: #fff; padding: 10px 15px; border-radius: 8px; margin-bottom: 25px; display: inline-block; font-weight: bold; }
          .badge { background: #30363d; color: #8b949e; border-radius: 12px; padding: 4px 10px; font-size: 12px; margin-left: 10px; vertical-align: middle; }
          ul { list-style-type: none; padding: 0; margin-top: 10px; }
          li { margin: 8px 0; font-size: 16px; }
          .footer { margin-top: 40px; font-size: 12px; color: #8b949e; border-top: 1px solid #30363d; padding-top: 10px; }
          .redirect { background: #161b22; border: 1px solid #30363d; padding: 12px; border-radius: 6px; margin-bottom: 20px; }
          </style></head><body>" > ./public/index.html

          echo "<h1>Playwright Test Reports</h1>" >> ./public/index.html
          echo "<div class='redirect'>⏳ Redirecting automatically to the latest report...<br>
          If you are not redirected in 5 seconds, <a href='reports/$REPORT_DIR/index.html'>click here</a>.</div>" >> ./public/index.html

          latest=$(ls -dt ./public/reports/playwright-report-* | head -1)
          latest_ts=$(basename "$latest")

          echo "<a class='latest' href='reports/${latest_ts}/index.html'>View Latest Report (${latest_ts})</a>" >> ./public/index.html
          echo "<span class='badge'>Last updated: $(date '+%B %d, %Y %I:%M:%S %p')</span>" >> ./public/index.html

          echo "<h2>All Reports</h2><ul>" >> ./public/index.html
          for d in $(ls -dt ./public/reports/playwright-report-*); do
            ts=$(basename "$d")
            echo "<li>🕒 <a href=\"reports/${ts}/index.html\">${ts}</a></li>" >> ./public/index.html
          done

          echo "</ul><div class='footer'>Generated automatically via GitHub Actions · $(date)</div></body></html>" >> ./public/index.html

      - name: 🚀 Deploy Playwright report to GitHub Pages (keep history)
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          keep_files: true
          commit_message: "📊 Publish Playwright report (${{ github.event.inputs.devices }}) - ${{ steps.timestamp.outputs.ts }}"

      - name: 🧹 Keep only latest 10 reports
        run: |
          git fetch origin gh-pages
          git checkout gh-pages
          ls -td reports/playwright-report-* | tail -n +11 | xargs rm -rf || true
          git add .
          git commit -m "🧹 Clean old reports" || true
          git push origin gh-pages
